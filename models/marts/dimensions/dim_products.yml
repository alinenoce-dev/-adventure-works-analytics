
models:
  - name: dim_products
    description: "Flattened product dimension. Consolidates the AdventureWorks product catalog by resolving the master two-level hierarchy of the Production schema (Product -> Subcategory -> Category), desconsidering the product model table in accordance with the updated business requirements."
    columns:
      - name: sk_product
        description: "Surrogate Key generated by MD5 cryptographic hash from the product_id business key."
        tests:
          - unique
          - not_null

      - name: pk_product
        description: "Business Key of the product, corresponding to the Production.Product table."
        tests:
          - unique
          - not_null

      - name: product_number
        description: "Internal unique code assigned to the product by the manufacturer."
        tests:
          - not_null 

      - name: product_name
        description: "Trade and friendly name of the product."
        tests:
          - not_null