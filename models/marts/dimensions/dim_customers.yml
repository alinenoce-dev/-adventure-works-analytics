
models:

  - name: dim_customers
    description: "Conformed dimension of AdventureWorks customers. Consolidates individual customer data (B2C) and corporate customers (B2B/Stores), resolving the complex inheritance modeling of the original ERP. Additionally, integrates the most recent credit card brand used in a denormalized way for trade analysis simplification."
    columns:
      - name: sk_customer
        description: "Surrogate Key generated by MD5 cryptographic hash from the customer_id business key."
        tests:
          - unique
          - not_null

      - name: pk_customer
        description: "Business Key of the customer, corresponding to the Sales.Customer table."
        tests:
          - unique
          - not_null

      - name: fk_person
        description: "Master foreign key pointing directly to the individual physical person (Person.Person). Null for strictly corporate clients."

      - name: fk_store
        description: "Master foreign key pointing directly to the partner store (Sales.Store). Null for strictly physical consumers."

      - name: fk_territory
        description: "Default sales territory code associated with this customer."

      - name: customer_type
        description: "Strategic customer segmentation. Classified as 'B2B' (Store/Corporate) or 'B2C' (Individual Person/End Consumer)."
        tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['B2B','B2C']

      - name: customer_name
        description: "Full name of the physical consumer (First Name + Middle Name + Last Name) or Trade Name/Corporate Name of the Store (B2B). If not found, falls back to 'Not Informed'."
        tests:
          - not_null
